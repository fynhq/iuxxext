<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsPageTitle">IUxx Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="page-head">
    <span class="logo-mark" aria-hidden="true"></span>
    <div>
      <h1 data-i18n="extensionName">IUxx</h1>
      <p data-i18n="optionsIntro">Manage rules, exceptions, and backups.</p>
    </div>
  </header>

  <main>
    <section class="card card-compact">
      <div class="card-head">
        <h2 data-i18n="behaviorHeading">Behavior</h2>
      </div>
      <label class="check-row">
        <input id="keep-open" type="checkbox">
        <span data-i18n="keepPickerOpen">Keep picker open after blocking</span>
      </label>
      <p id="behavior-status" class="status" role="status"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="whitelistHeading">Exceptions</h2>
      </div>
      <form id="wl-form" class="wl-form">
        <input id="wl-input" type="text" placeholder="example.com" data-i18n-placeholder="whitelistPlaceholder" autocomplete="off" spellcheck="false" aria-label="Domain to add to exceptions" data-i18n-aria-label="whitelistInputAria">
        <button id="wl-add" type="submit" data-i18n="add">Add</button>
      </form>
      <p id="wl-error" class="form-error hidden"></p>
      <ul id="wl-list" class="wl-list"></ul>
      <p id="wl-empty" class="empty" data-i18n="whitelistEmpty">No exceptions yet.</p>
    </section>

    <details id="rule-card" class="card details-card">
      <summary class="card-head">
        <h2 id="rule-form-title" data-i18n="addRuleHeading">Add rule</h2>
        <span class="chevron" aria-hidden="true"></span>
      </summary>
      <div class="details-body">
        <form id="rule-form" class="rule-form">
          <div class="field-row">
            <div class="field">
              <label for="rule-host" data-i18n="ruleHostLabel">Site</label>
              <input id="rule-host" type="text" placeholder="example.com" data-i18n-placeholder="ruleHostPlaceholder" autocomplete="off" spellcheck="false">
            </div>
            <div class="field">
              <label for="rule-scope" data-i18n="ruleScopeLabel">Scope</label>
              <select id="rule-scope">
                <option value="host" data-i18n="scopeHost">This host</option>
                <option value="domain" data-i18n="scopeDomain">Host + subdomains</option>
                <option value="global" data-i18n="scopeGlobal">All sites</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="rule-selector" data-i18n="ruleSelectorLabel">Selector</label>
            <input id="rule-selector" type="text" placeholder=".ad-banner" autocomplete="off" spellcheck="false">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="rule-path" data-i18n="rulePathLabel">Path prefix</label>
              <input id="rule-path" type="text" placeholder="/watch" autocomplete="off" spellcheck="false">
            </div>
            <div class="field">
              <label for="rule-preview" data-i18n="rulePreviewLabel">Label</label>
              <input id="rule-preview" type="text" placeholder="Promo banner" data-i18n-placeholder="rulePreviewPlaceholder" autocomplete="off">
            </div>
          </div>
          <p class="field-hint" data-i18n="ruleFormHint">Limits to this path and its subpaths.</p>
          <div class="form-actions">
            <button id="rule-submit" class="primary" type="submit" data-i18n="addRuleButton">Add</button>
            <button id="rule-cancel" class="ghost" type="button" data-i18n="cancel" hidden>Cancel</button>
          </div>
          <p id="rule-error" class="form-error hidden"></p>
        </form>
      </div>
    </details>

    <section class="card">
      <div class="card-head rules-head">
        <h2><span data-i18n="allRulesHeading">Rules</span> <span id="rules-count" class="badge">0</span></h2>
        <div class="rules-toolbar">
          <input id="rule-search" type="search" placeholder="Search rules" data-i18n-placeholder="ruleSearchPlaceholder" autocomplete="off" aria-label="Search rules" data-i18n-aria-label="ruleSearchAria">
          <span id="search-count" class="search-count"></span>
        </div>
        <p id="limit-warning" class="limit-warning hidden"></p>
        <p id="rules-status" class="status" role="status"></p>
      </div>
      <div id="rules-root" class="rules-root"></div>
      <p id="rules-empty" class="empty" data-i18n="rulesEmpty">No rules yet.</p>
    </section>

    <details id="backup-card" class="card details-card">
      <summary class="card-head">
        <h2 data-i18n="backupHeading">Backup</h2>
        <span class="chevron" aria-hidden="true"></span>
      </summary>
      <div class="details-body">
        <div class="backup-actions">
          <button id="export-btn" class="primary" type="button" data-i18n="exportButton">Export</button>
          <select id="import-mode" class="select" aria-label="Import mode" data-i18n-aria-label="importModeAria">
            <option value="merge" data-i18n="importMerge">Merge</option>
            <option value="replace" data-i18n="importReplace">Replace</option>
          </select>
          <button id="import-btn" class="file-btn" type="button" data-i18n="importButton">Import</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
        <p id="backup-status" class="status" role="status"></p>
      </div>
    </details>
  </main>

  <div id="undo-bar" class="undo-bar hidden" role="status" aria-live="polite">
    <span id="undo-text"></span>
    <button id="undo-btn" class="undo-btn" type="button" data-i18n="undo">Undo</button>
  </div>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
